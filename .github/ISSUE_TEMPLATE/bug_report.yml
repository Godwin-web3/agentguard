name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes: { value: "**Security issue?** Do not file it here. See [SECURITY.md](https://github.com/Godwin-web3/agentguard/blob/main/SECURITY.md)." }
  - type: dropdown
    id: area
    attributes: { label: Component, options: [Gateway (server / API), "@agentguard-dev/intent-verifier", "@agentguard-dev/paypal-toolkit", Owner console / website, Docs] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps, expected vs actual. Redact keys, tokens and receipts with personal data." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit, placeholder: "0.1.0 or a commit SHA" }
  - type: input
    id: node
    attributes: { label: Node version, placeholder: "node -v" }
